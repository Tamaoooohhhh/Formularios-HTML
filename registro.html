<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" href="img/logo.png" type="image/png">
</head>

<body>
    <main>
        <section>
            <form action="">
                <fieldset>
                    <legend>Crear cuenta</legend>

                    <label for="">Nombre completo</label>
                    <input type="text" placeholder="Mateo Tamayo" required>

                    <label for="">Género</label>
                    <div class="grupo-radios">
                        <label for="">Femenino</label>
                        <input type="radio" value="femenino">

                        <label for="">Masculino</label>
                        <input type="radio" value="masculino">

                        <label for="">Otro</label>
                        <input type="radio" value="otro">
                    </div>

                    <label for="">Foto de perfil</label>
                    <input type="file" accept="image/*">

                    <label for="">Correo electrónico</label>
                    <input type="email" placeholder="correo@ejemplo.com">

                    <label for="">Teléfono</label>
                    <input type="tel" placeholder="+57 3000000000">

                    <label for="">País</label>
                    <select name="" id="">
                        <option value="">Selecciona tu país</option>
                        <option value="ar">Argentina</option>
                        <option value="co">Colombia</option>
                        <option value="mx">México</option>
                        <option value="es">España</option>
                        <option value="otro">Otro</option>
                    </select>

                    <label for="">Contraseña</label>
                    <input type="password" placeholder="********">

                    <label for="">Acepto los términos y condiciones</label>
                    <input type="checkbox" required>

                    <label for="">Deseo recibir noticias por correo</label>
                    <input type="checkbox">

                    <input type="submit" value="Registrarme">
                    <input type="reset" value="Limpiar">

                    <p class="enlace">¿Ya tienes una cuenta? <a href="login.html"> Inicia sesión aquí</a></p>
                </fieldset>
            </form>
        </section>
    </main>
    
</body>

</html>
